# Publishes the extension to the VS Code Marketplace when a GitHub Release is published.
# The release tag must match package.json's version (e.g. tag v0.1.0 for version 0.1.0).
# Needs a repository secret VSCE_PAT: an Azure DevOps token with Marketplace > Manage scope.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write # to attach the .vsix to the release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm test

      - name: Package
        run: npx vsce package --out diff-notes.vsix

      - name: Publish to Marketplace
        run: npx vsce publish --packagePath diff-notes.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Attach .vsix to the release
        run: gh release upload "$GITHUB_REF_NAME" diff-notes.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
